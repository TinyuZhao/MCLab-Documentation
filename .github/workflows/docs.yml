name: Build docs

on:
  push:
    branches:
      - main
    paths:
      - "ednex_docs/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "ednex_docs/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ednex_docs/requirements.txt

      - name: Install Python packages
        run: pip install -r ednex_docs/requirements.txt

      # source/_api_stubs/ is committed in this repository, so the docs build
      # does not need the firmware tree under ports/esp32/m5stack-libs.
      - name: Build Ednex docs
        run: make -C ednex_docs en

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ednex_docs/build/html/en

  deploy:
    # Pull requests only verify the build; the site is published from main.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
